name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Vite Plus
        uses: heyongqi02/workflows/setup-vp@vp
        with:
          fetch-all: true
          cache: false

      - name: Lint
        run: vp run lint

      - name: Unit and integration tests
        run: vp run test

      - name: Install Playwright browsers
        run: vp exec playwright install chromium --with-deps

      - name: E2E tests
        run: vp run test:e2e
        env:
          CI: true
