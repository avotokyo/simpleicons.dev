name: Unit Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Vite Plus
        uses: avotokyo/workflows/setup-vp@main
        with:
          fetch-all: true
          cache: false

      - name: Lint
        run: vp run lint

      - name: Unit and integration tests
        run: vp test
